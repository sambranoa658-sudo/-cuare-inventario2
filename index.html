<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuare Limitada · Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="modo-local.js"></script>
<style>
:root{color-scheme:light dark;
 --bg:light-dark(#ffffff,#0d0e18);--panel:light-dark(#f4f5f8,#161827);--line:light-dark(#dfe2ea,#2a2d42);
 --ink:light-dark(#14110f,#eceef6);--mute:light-dark(#5d6272,#9aa0b6);--acc:light-dark(#1d2bd8,#8f99ff);
 --accbg:light-dark(#e9ebfd,#1d2150);--ok:light-dark(#1e7a3c,#6fd391);--okbg:light-dark(#e5f4e4,#15301f);
 --bad:light-dark(#b42318,#ff8f85);--badbg:light-dark(#fbebeb,#3a1716);--warn:light-dark(#8a5a00,#f2c46d);--warnbg:light-dark(#f9eeda,#33270f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Spectral,Georgia,serif;font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:12px max(4vw,14px) 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:Spectral,serif;font-size:24px;font-weight:600}
.brand small{color:var(--mute);font-size:13px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--acc);display:grid;place-items:center;color:#fff;font-weight:700}
.sync{margin-left:auto;font-size:13px;color:var(--mute)}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 max(4vw,14px)}
nav a{flex:none;padding:10px 14px;color:var(--mute);text-decoration:none;border-bottom:3px solid transparent;font-weight:500;font-size:15px}
nav a.on{color:var(--ink);border-color:var(--acc)}
main{max-width:1240px;margin:0 auto;padding:20px max(4vw,14px) 80px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.in{background:var(--okbg);color:var(--ok);border-color:transparent}
.btn.out{background:var(--badbg);color:var(--bad);border-color:transparent}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
textarea{min-height:72px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0 24px}
.kpi{background:var(--panel);border-radius:14px;padding:16px}
.kpi span{font-size:13px;color:var(--mute)}
.kpi b{display:block;font-size:clamp(26px,4vw,34px);font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media(max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{font-size:20px;margin-bottom:10px}
.bars .b{display:grid;grid-template-columns:9em minmax(0,1fr) 4em;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.bars .t{height:12px;background:var(--panel);border-radius:6px;overflow:hidden}.bars .t i{display:block;height:100%;background:var(--acc)}
.bars .n{text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{min-height:36px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:8px}
.tag{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg)}
.tag:hover{border-color:var(--acc)}
.code{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;color:var(--acc);letter-spacing:-.01em}
.tag .nm{font-weight:600}.tag .sub{font-size:14px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag .qty{text-align:right;white-space:nowrap}.tag .qty b{font-size:20px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pA{background:var(--okbg);color:var(--ok)}.pB{background:var(--warnbg);color:var(--warn)}.pC,.pX{background:var(--badbg);color:var(--bad)}.pR{background:var(--accbg);color:var(--acc)}
@media(max-width:520px){.tag{grid-template-columns:58px minmax(0,1fr)}.tag .qty{grid-column:2;text-align:left}.code{font-size:17px}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:13px}
td.r,th.r{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.note{font-size:14px;color:var(--mute)}
.bad{color:var(--bad)}
dialog{border:0;border-radius:16px;padding:0;width:min(640px,94vw);max-height:92vh;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,30,.5)}
.dh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
.dh h2{font-size:22px;flex:1}
.db{padding:18px;overflow:auto}
.x{width:44px;height:44px;border-radius:10px;border:0;background:var(--panel);cursor:pointer;font-size:20px}
.qrbox{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center;background:var(--panel);border-radius:12px;padding:12px;margin-bottom:14px}
.qrbox svg{width:150px;height:150px;background:#fff;border-radius:8px}
@media(max-width:480px){.qrbox{grid-template-columns:minmax(0,1fr)}.qrbox svg{margin:auto}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 16px;margin:12px 0}
.kv div span{display:block;font-size:12px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
.hide{display:none!important}
.sec{margin:24px 0 10px;font-size:22px}
</style>
</head>
<body>
<header class="top">
 <div class="bar">
  <div class="brand"><div class="logo" aria-hidden="true">C</div><div><b>Cuare Limitada</b><br><small>Inventario de equipos</small></div></div>
  <div class="sync" id="sync">Conectando…</div>
 </div>
 <nav id="nav">
  <a href="#inicio">Inicio</a><a href="#inventario">Inventario</a><a href="#movimientos">Entradas y salidas</a><a href="#etiquetas">QR y etiquetas</a><a href="#exportar">Exportar Excel</a><a href="#categorias">Categorías</a>
 </nav>
</header>
<main id="main"></main>
<dialog id="dlg"><div class="dh"><h2 id="dlgT"></h2><button class="x" id="dlgX" aria-label="Cerrar">×</button></div><div class="db" id="dlgB"></div></dialog>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="scanIn" accept="image/*" capture="environment" class="hide">
<script>
{
const APP_URL = window.__cuareLocal ? location.origin + location.pathname : 'https://claude.ai/artifact/Gqj6aovDZjhniXEz5puEN3';
const S = {items:[], cats:[], movs:[], db:null, dl:null, ai:null, ready:false, cat:'', sub:'todas', q:'', est:''};
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clp = n => '$' + Math.round(+n || 0).toLocaleString('es-CL');
const today = () => new Date().toISOString().slice(0,10);
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2600); };
const ls = { get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
const safeId = s => String(s).trim().replace(/[^A-Za-z0-9_-]/g,'-');

const catOf = id => S.cats.find(c => c.id === id);
const fieldsOf = c => (c && Array.isArray(c.campos)) ? c.campos : [];
const isPrinter = it => it.cat === 'impresoras';
const condOf = it => it.cond || 'Buena';
const conProblema = it => condOf(it) !== 'Buena';
const estantes = () => [...new Set(['A','B','C', ...S.items.map(i => (i.ubic||'').trim()).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));
const venc = it => { const v = it.a && it.a.vence; if (!v) return false; const m = String(v).match(/(\d{1,2})\s*\/\s*(\d{4})|(\d{4})/); if (!m) return false; const y = +(m[2] || m[3]), mo = m[1] ? +m[1] : 12; const d = new Date(); return y < d.getFullYear() || (y === d.getFullYear() && mo < d.getMonth()+1); };
const condPill = it => { const c = condOf(it); return `<span class="pill ${c==='Buena'?'pA':c==='Con detalles'?'pB':'pC'}">${esc(c)}</span>`; };
const estPill = it => it.ubic ? `<span class="pill pR">Estante ${esc(it.ubic)}</span>` : '';
const nuevoTxt = it => it.pNuevo ? clp(it.pNuevo) : '';

/* ---------- QR ---------- */
const qrFor = code => { const q = qrcode(0, 'M'); q.addData(APP_URL + '#eq-' + safeId(code)); q.make(); return q; };
const qrSvg = code => { if (typeof qrcode === 'undefined') return '<svg></svg>'; const q = qrFor(code), n = q.getModuleCount(); let p = ''; for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (q.isDark(r,c)) p += `M${c+2} ${r+2}h1v1h-1z`; return `<svg viewBox="0 0 ${n+4} ${n+4}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${p}" fill="#000"/></svg>`; };

/* ---------- datos ---------- */
function nextCode(cat, falla){
 const c = catOf(cat); if (!c) return '';
 let start = +c.inicio || 1; if (cat === 'impresoras' && falla) start = 4100;
 const end = cat === 'impresoras' && !falla ? 4099 : start + 9999;
 const used = new Set(S.items.map(i => String(i.code)));
 let n = start; while (used.has(String(n)) && n < end) n++;
 return String(n);
}
async function saveItem(it){
 if (!S.db) { toast('Sin conexión: no se pudo guardar'); return false; }
 try { await S.db.collection('items').doc(safeId(it.code)).set(it); return true; }
 catch(e){ toast(e.code === 'quota_exceeded' ? 'Se alcanzó el límite de la base de datos' : 'No se pudo guardar. Revisa tu permiso de edición.'); return false; }
}
async function addMov(it, tipo, d){
 const cant = Math.max(1, Math.round(+d.cant || 0));
 if (tipo === 'salida' && cant > (+it.cant||0)) { toast('No hay stock suficiente (' + (it.cant||0) + ' disponibles)'); return false; }
 const nueva = tipo === 'entrada' ? (+it.cant||0) + cant : (+it.cant||0) - cant;
 const m = {code:String(it.code), desc:(it.marca+' '+it.modelo).trim(), cat:it.cat, tipo, motivo:d.motivo, cant, fecha:d.fecha||today(), quien:d.quien||'', contra:d.contra||'', precio:+d.precio||0, nota:d.nota||'', stock:nueva, ts:Date.now()};
 try { await S.db.collection('movs').add(m); await S.db.collection('items').doc(safeId(it.code)).update({cant:nueva}); ls.set('quien', d.quien||''); toast((tipo==='entrada'?'Entrada':'Salida') + ' registrada · stock ' + nueva); return true; }
 catch(e){ toast('No se pudo registrar el movimiento'); return false; }
}

/* ---------- vistas ---------- */
function vInicio(){
 const it = S.items, uni = it.reduce((a,b)=>a+(+b.cant||0),0), val = it.reduce((a,b)=>a+(+b.cant||0)*(+b.precio||0),0);
 const rev = it.filter(i=>i.revisar), sin = it.filter(i=>(+i.cant||0)===0), ven = it.filter(venc), prob = it.filter(i=>isPrinter(i)&&conProblema(i));
 const byCat = S.cats.map(c => ({c, n: it.filter(i=>i.cat===c.id).reduce((a,b)=>a+(+b.cant||0),0)})); const mx = Math.max(1,...byCat.map(x=>x.n));
 const alert = (t, arr, cls) => arr.length ? `<div class="card"><h3>${t} <span class="pill ${cls}">${arr.length}</span></h3><div class="list">${arr.slice(0,6).map(tagHtml).join('')}</div>${arr.length>6?`<p class="note">y ${arr.length-6} más…</p>`:''}</div>` : '';
 return `<h1 style="font-size:clamp(30px,5vw,44px)">Inventario al ${new Date().toLocaleDateString('es-CL')}</h1>
 <div class="kpis"><div class="kpi"><span>Productos distintos</span><b>${it.length}</b></div><div class="kpi"><span>Unidades en stock</span><b>${uni}</b></div><div class="kpi"><span>Valor del stock (precio usado)</span><b>${clp(val)}</b></div><div class="kpi"><span>Impresoras con problemas</span><b>${prob.length}</b></div></div>
 <div class="row" style="margin-bottom:20px"><button class="btn pri" data-act="nuevo">+ Agregar producto</button><button class="btn" data-act="scan">Escanear QR</button><button class="btn" data-go="exportar">Descargar Excel</button>${S.ai && it.some(i=>!i.pNuevo)?`<button class="btn" data-act="aiAll">Estimar precio nuevo (${it.filter(i=>!i.pNuevo).length} sin precio)</button>`:''}</div>
 <div class="cols"><div class="card"><h3>Unidades por categoría</h3><div class="bars">${byCat.map(x=>`<div class="b"><span>${esc(x.c.nombre)}</span><div class="t"><i style="width:${x.n/mx*100}%"></i></div><span class="n">${x.n}</span></div>`).join('')}</div></div>
 <div class="card"><h3>Unidades por estante</h3><div class="bars">${(()=>{const es=[...new Set(it.map(i=>(i.ubic||'').trim()||'Sin estante'))].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));const v=es.map(e=>({e,n:it.filter(i=>((i.ubic||'').trim()||'Sin estante')===e).reduce((a,b)=>a+(+b.cant||0),0)}));const m=Math.max(1,...v.map(x=>x.n));return v.map(x=>`<div class="b"><span>${x.e==='Sin estante'?'Sin estante':'Estante '+esc(x.e)}</span><div class="t"><i style="width:${x.n/m*100}%"></i></div><span class="n">${x.n}</span></div>`).join('')})()}</div></div></div><div class="cols" style="margin-top:20px"><div class="card"><h3>Últimos movimientos</h3>${S.movs.length?movTable(S.movs.slice(0,6),true):'<div class="empty">Aún no hay entradas ni salidas registradas.</div>'}</div></div>
 <div class="cols" style="margin-top:20px">${alert('Datos por revisar', rev, 'pR')}${alert('Cartuchos vencidos', ven, 'pX')}${alert('Sin stock', sin, 'pC')}</div>`;
}
function tagHtml(i){
 const c = catOf(i.cat), a = i.a || {};
 const extra = fieldsOf(c).slice(0,3).map(f=>a[f.k]).filter(Boolean).join(' · ');
 return `<div class="tag" data-item="${esc(i.code)}" tabindex="0" role="button"><div class="code">${esc(i.code)}</div><div><div class="nm">${esc(i.marca)} ${esc(i.modelo)}</div><div class="sub">${esc(extra || (c?c.nombre:''))}${i.obs?' — '+esc(i.obs):''}</div><div style="margin-top:4px">${condPill(i)} ${estPill(i)} ${i.revisar?'<span class="pill pR">Revisar</span>':''} ${venc(i)?'<span class="pill pX">Vencido</span>':''}</div></div><div class="qty"><b>${+i.cant||0}</b> u.<br><span class="note">Usado: ${i.precio?clp(i.precio):'—'}</span><br><span class="note">Nuevo: ${nuevoTxt(i)||'—'}</span></div></div>`;
}
function filtered(){
 let r = S.items.filter(i => !S.cat || i.cat === S.cat);
 if (S.cat === 'impresoras' && S.sub !== 'todas') r = r.filter(i => S.sub === 'buenas' ? !conProblema(i) : conProblema(i));
 if (S.est) r = r.filter(i => (i.ubic||'').trim() === S.est);
 const q = S.q.toLowerCase().trim();
 if (q) r = r.filter(i => [i.code,i.marca,i.modelo,i.obs,i.ubic,...Object.values(i.a||{})].join(' ').toLowerCase().includes(q));
 return r.sort((a,b)=>String(a.code).localeCompare(String(b.code),'es',{numeric:true}));
}
function vInventario(){
 const r = filtered();
 return `<div class="row" style="justify-content:space-between"><h1 style="font-size:clamp(28px,4vw,38px)">Inventario</h1><div class="row"><button class="btn" data-act="scan">Escanear QR</button><button class="btn pri" data-act="nuevo">+ Agregar producto</button></div></div>
 <div class="chips"><button class="chip ${!S.cat?'on':''}" data-cat="">Todo (${S.items.length})</button>${S.cats.map(c=>`<button class="chip ${S.cat===c.id?'on':''}" data-cat="${esc(c.id)}">${esc(c.nombre)} (${S.items.filter(i=>i.cat===c.id).length})</button>`).join('')}</div>
 ${S.cat==='impresoras'?`<div class="chips"><button class="chip ${S.sub==='todas'?'on':''}" data-sub="todas">Todas</button><button class="chip ${S.sub==='buenas'?'on':''}" data-sub="buenas">Buenas</button><button class="chip ${S.sub==='malas'?'on':''}" data-sub="malas">Con problemas o detalles</button></div>`:''}
 <div class="row" style="margin-bottom:14px;flex-wrap:nowrap"><input id="q" type="search" placeholder="Buscar por código, marca, modelo, observación…" value="${esc(S.q)}" style="flex:1"><select id="fEst" aria-label="Filtrar por estante" style="width:auto;flex:none"><option value="">Todos los estantes</option>${estantes().map(e=>`<option value="${esc(e)}" ${S.est===e?'selected':''}>Estante ${esc(e)}</option>`).join('')}</select></div>
 <div class="list" id="lst">${r.length?r.map(tagHtml).join(''):'<div class="empty">No hay productos que coincidan.</div>'}</div>`;
}
function movTable(ms, short){
 return `<div class="scroll"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Código</th>${short?'':'<th>Producto</th><th>Motivo</th><th>Cliente / proveedor</th><th>Responsable</th>'}<th class="r">Cant.</th>${short?'':'<th class="r">Stock</th>'}</tr></thead><tbody>${ms.map(m=>`<tr><td style="white-space:nowrap">${esc(m.fecha)}</td><td><span class="pill ${m.tipo==='entrada'?'pA':'pC'}">${m.tipo==='entrada'?'Entrada':'Salida'}</span></td><td><a href="#eq-${esc(safeId(m.code))}">${esc(m.code)}</a></td>${short?'':`<td>${esc(m.desc)}</td><td>${esc(m.motivo)}</td><td>${esc(m.contra)}</td><td>${esc(m.quien)}</td>`}<td class="r">${m.tipo==='entrada'?'+':'−'}${esc(m.cant)}</td>${short?'':`<td class="r">${esc(m.stock)}</td>`}</tr>`).join('')}</tbody></table></div>`;
}
function vMovs(){
 return `<div class="row" style="justify-content:space-between"><h1 style="font-size:clamp(28px,4vw,38px)">Entradas y salidas</h1><div class="row"><button class="btn in" data-act="mov" data-t="entrada">+ Entrada</button><button class="btn out" data-act="mov" data-t="salida">− Salida</button><button class="btn" data-act="scan">Escanear QR</button></div></div>
 <p class="note">Cada movimiento actualiza solo el stock del producto. Para registrar uno, elige el producto por código o escanea su QR.</p>
 ${S.movs.length?movTable(S.movs,false):'<div class="empty">Aún no hay movimientos.</div>'}`;
}
function vEtiquetas(){
 return `<h1 style="font-size:clamp(28px,4vw,38px)">QR y etiquetas</h1>
 <p class="note" style="max-width:68ch">Cada producto tiene un QR que abre su ficha en esta app. Al escanearlo con la cámara del celular puedes registrar una entrada o salida al momento. Descarga una hoja de etiquetas, ábrela y mándala a imprimir.</p>

function rowsFor(items){
 return items.map(i => { const c = catOf(i.cat), r = {'Código':i.code, 'Marca':i.marca, 'Modelo':i.modelo};
  fieldsOf(c).forEach(f => r[f.l] = (i.a||{})[f.k] || '');
  Object.assign(r, {'Cantidad':+i.cant||0, 'Condición':condOf(i), 'Estante':i.ubic||'', 'Precio usado (venta)':+i.precio||0, 'Precio nuevo mercado':+i.pNuevo||'', 'Referencia precio nuevo':i.pNuevoRef||'', 'Valor total usado':(+i.cant||0)*(+i.precio||0), 'Observaciones':i.obs||'', 'Por revisar':i.revisar?'Sí':''});
  return r; });
}
const sortC = a => a.slice().sort((x,y)=>String(x.code).localeCompare(String(y.code),'es',{numeric:true}));
function addSheet(wb, name, rows, empty){
 const ws = rows.length ? XLSX.utils.json_to_sheet(rows) : XLSX.utils.aoa_to_sheet([[empty || 'Sin datos']]);
 if (rows.length) ws['!cols'] = Object.keys(rows[0]).map(k => ({wch: Math.min(45, Math.max(k.length, ...rows.map(r => String(r[k]).length)) + 2)}));
 XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31).replace(/[\\/?*\[\]:]/g,' '));
}
function printerSheets(wb){

async function save(filename, data){

 try { await S.dl.save({filename, data}); toast('Archivo listo: ' + filename); }
 catch(e){ toast(e.code === 'declined' ? 'Descarga cancelada' : e.code === 'host_unavailable' ? 'Abre la app en un navegador para descargar' : 'No se pudo descargar'); }
}
async function exportXls(k){
 if (typeof XLSX === 'undefined') { toast('No se cargó el módulo de Excel. Recarga la página.'); return; }
 const wb = XLSX.utils.book_new(), f = today(); let name = 'Cuare_inventario_' + f + '.xlsx';
 if (k === 'todo') {
  const res = S.cats.map(c => { const it = S.items.filter(i=>i.cat===c.id); return {'Categoría':c.nombre, 'Productos':it.length, 'Unidades':it.reduce((a,b)=>a+(+b.cant||0),0), 'Valor':it.reduce((a,b)=>a+(+b.cant||0)*(+b.precio||0),0)}; });
  addSheet(wb, 'Resumen', res);
  S.cats.forEach(c => c.id === 'impresoras' ? printerSheets(wb) : addSheet(wb, c.nombre, rowsFor(sortC(S.items.filter(i=>i.cat===c.id)))));

 else if (k === 'cat') { const c = catOf($('#xCat').value); if (c.id === 'impresoras') printerSheets(wb); else addSheet(wb, c.nombre, rowsFor(sortC(S.items.filter(i=>i.cat===c.id)))); name = 'Cuare_' + safeId(c.nombre) + '_' + f + '.xlsx'; }
 else { const d = $('#xD').value || '0000', h = $('#xH').value || '9999';
  const ms = S.movs.filter(m => m.fecha >= d && m.fecha <= h).map(m => ({'Fecha':m.fecha, 'Tipo':m.tipo==='entrada'?'Entrada':'Salida', 'Código':m.code, 'Producto':m.desc, 'Motivo':m.motivo, 'Cantidad':m.cant, 'Precio unitario':m.precio||'', 'Cliente / proveedor':m.contra, 'Responsable':m.quien, 'Stock después':m.stock, 'Nota':m.nota}));
  addSheet(wb, 'Movimientos', ms, 'Sin movimientos en ese rango'); name = 'Cuare_movimientos_' + d + '_a_' + h + '.xlsx'; }
 await save(name, new Uint8Array(XLSX.write(wb, {type:'array', bookType:'xlsx'})));
}

async function labelPng(code){
 const it = S.items.find(i => safeId(i.code) === safeId(code)); if (!it) return;
 const q = qrFor(it.code), n = q.getModuleCount(), s = 8, W = 760, H = (n+4)*s + 40;
 const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
 g.fillStyle = '#fff'; g.fillRect(0,0,W,H); g.fillStyle = '#000';
 for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (q.isDark(r,c)) g.fillRect(20+(c+2)*s, 20+(r+2)*s, s, s);
 const x = (n+4)*s + 44; g.font = '600 20px Arial'; g.fillStyle = '#555'; g.fillText('CUARE LIMITADA', x, 70);
 g.fillStyle = '#000'; g.font = 'bold 64px Arial'; g.fillText(String(it.code), x, 140);
 g.font = '26px Arial'; g.fillText((it.marca + ' ' + it.modelo).slice(0,28), x, 190);
 if (it.precio) { g.font = 'bold 30px Arial'; g.fillText(clp(it.precio), x, 240); }
 cv.toBlob(b => b && save('Etiqueta_' + safeId(it.code) + '.png', b), 'image/png');
}

/* ---------- precio de mercado (estimación con Claude; solo dentro de Claude) ---------- */
async function estimar(list, btn){
 if (!S.ai) { toast('La estimación automática solo funciona dentro de Claude. Ingresa el precio nuevo a mano.'); return; }
 if (estimar.busy) { toast('Ya hay una estimación en curso'); return; }
 estimar.busy = true; if (btn) { btn.disabled = true; btn.textContent = 'Estimando…'; }
 toast('Estimando precio nuevo de ' + list.length + (list.length===1?' equipo…':' equipos…'));
 const datos = list.slice(0,80).map(i => ({code:String(i.code), categoria:(catOf(i.cat)||{}).nombre||i.cat, marca:i.marca, modelo:i.modelo, detalle:Object.values(i.a||{}).filter(v=>String(v).length<60).join(', ')}));
 const prompt = 'Eres un tasador de equipos de computación e impresión en Chile. Para cada equipo de la lista, estima el precio de venta de ese equipo NUEVO en el mercado chileno hoy (' + today() + '), en pesos chilenos (CLP) con IVA. Si el modelo está descontinuado y ya no se vende nuevo, da el precio de un modelo nuevo equivalente actual y nómbralo en "referencia". Para tóner o cartuchos alternativos da el precio de un original o compatible nuevo según corresponda. Sé realista y conservador.\n\nResponde SOLO un arreglo JSON, un objeto por equipo, así: [{"code":"4001","precio":250000,"referencia":"Descontinuado; equivalente HP LaserJet Pro 4003dn"}]\n\nEquipos:\n' + JSON.stringify(datos);
 try {
  const res = await S.ai.json(prompt, {cache:false});
  let ok = 0;
  for (const r of (Array.isArray(res) ? res : [])) {
   const x = S.items.find(i => String(i.code) === String(r && r.code)); const p = Math.round(+(r && r.precio) || 0);
   if (!x || !p || p < 100 || p > 100000000) continue;
   try { await S.db.collection('items').doc(safeId(x.code)).update({pNuevo:p, pNuevoRef:'Estimado por Claude: ' + String(r.referencia||'').slice(0,200), pNuevoFecha:today()}); ok++; } catch(e){}
  }
  toast(ok ? 'Precio nuevo estimado para ' + ok + (ok===1?' equipo':' equipos') + '. Verifícalo antes de usarlo.' : 'No se obtuvo una estimación válida');
  const cur = dlg.open && list.length === 1 ? list[0].code : null; if (cur) showItem(cur);
 } catch(e){
  toast(e.code === 'not_granted' ? 'No se dio permiso para usar Claude' : e.code === 'rate_limited' ? 'Demasiadas consultas; intenta más tarde' : 'No se pudo estimar el precio; intenta de nuevo');
 } finally { estimar.busy = false; if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = 'Estimar precio nuevo de mercado'; } }
}

/* ---------- escanear ---------- */
$('#scanIn').onchange = async e => {
 const f = e.target.files[0]; e.target.value = ''; if (!f) return;
 try {
  const img = await createImageBitmap(f); const sc = Math.min(1, 1400 / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
  const g = cv.getContext('2d'); g.drawImage(img, 0, 0, cv.width, cv.height);
  let txt = '';
  if ('BarcodeDetector' in window) { try { const r = await new BarcodeDetector({formats:['qr_code']}).detect(cv); if (r[0]) txt = r[0].rawValue; } catch(x){} }
  if (!txt && typeof jsQR !== 'undefined') { const d = g.getImageData(0,0,cv.width,cv.height); const r = jsQR(d.data, cv.width, cv.height); if (r) txt = r.data; }
  if (!txt) { toast('No se encontró un QR en la foto. Intenta más cerca y con luz.'); return; }
  const m = txt.match(/#eq-([A-Za-z0-9_-]+)/); showItem(m ? m[1] : txt.trim());
 } catch(err){ toast('No se pudo leer la imagen'); }
};

/* ---------- navegación ---------- */
const views = {inicio:vInicio, inventario:vInventario, movimientos:vMovs, etiquetas:vEtiquetas, exportar:vExportar, categorias:vCats};
let cur = 'inicio';
function route(){
 const h = location.hash.slice(1);
 if (h.startsWith('eq-')) { if (!views[cur]) cur = 'inventario'; render(); showItem(h.slice(3)); return; }
 cur = views[h] ? h : 'inicio'; render();
}
function render(){
 document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur));
 if (!S.ready) { $('#main').innerHTML = '<div class="empty">Cargando inventario…</div>'; return; }
 const ae = document.activeElement, keep = ae && ae.id === 'q' ? ae.selectionStart : null;
 $('#main').innerHTML = views[cur]();
 if (keep !== null && $('#q')) { $('#q').focus(); $('#q').setSelectionRange(keep, keep); }
}
window.addEventListener('hashchange', route);
document.addEventListener('change', e => { if (e.target.id === 'fEst') { S.est = e.target.value; render(); } });
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; const r = filtered(); $('#lst').innerHTML = r.length ? r.map(tagHtml).join('') : '<div class="empty">No hay productos que coincidan.</div>'; } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.item) showItem(e.target.dataset.item); });
document.addEventListener('click', async e => {
 const t = e.target.closest('[data-act],[data-cat],[data-sub],[data-item],[data-go]'); if (!t) return;
 if (t.dataset.go !== undefined) { location.hash = t.dataset.go; return; }
 if (t.dataset.cat !== undefined) { S.cat = t.dataset.cat; S.sub = 'todas'; render(); return; }
 if (t.dataset.sub !== undefined) { S.sub = t.dataset.sub; render(); return; }
 if (t.dataset.item !== undefined && !t.dataset.act) { showItem(t.dataset.item); return; }
 const a = t.dataset.act, code = t.dataset.code;
 if (!S.db && ['nuevo','mov','edit','cat','delok'].includes(a)) { toast('Sin conexión a la base de datos'); return; }
 if (a === 'nuevo') itemForm(null);
 else if (a === 'edit') itemForm(S.items.find(i => i.code === code));
 else if (a === 'mov') movForm(t.dataset.t, code);
 else if (a === 'scan') $('#scanIn').click();
 else if (a === 'cat') catForm(t.dataset.id);
 else if (a === 'del') confirmDel(code);
 else if (a === 'delok') { try { await S.db.collection('items').doc(safeId(code)).delete(); toast('Producto eliminado'); closeDlg(); } catch(err){ toast('No se pudo eliminar'); } }
 else if (a === 'close') closeDlg();
 else if (a === 'xls') exportXls(t.dataset.k);
 else if (a === 'labels') labels();
 else if (a === 'png') labelPng(code);
 else if (a === 'ai1') { const x = S.items.find(i => i.code === code); if (x) estimar([x], t); }
 else if (a === 'aiAll') { const f = S.items.filter(i => !i.pNuevo); if (!f.length) toast('Todos los productos ya tienen precio nuevo'); else estimar(f, t); }
});

/* ---------- conexión ---------- */
route();
(async () => {
 const timer = setTimeout(() => { if (!S.ready) { $('#sync').textContent = 'Sin conexión aún'; $('#main').innerHTML = '<div class="empty">No se puede llegar a la base de datos todavía. Revisa tu conexión; la app seguirá intentando.</div>'; } }, 10000);
 const db = await claude.use('db'); S.dl = await claude.use('downloads'); S.ai = await claude.use('sample');
 if (!db) { clearTimeout(timer); $('#sync').textContent = 'Solo lectura'; S.ready = true; render(); $('#main').insertAdjacentHTML('afterbegin', '<div class="empty bad" style="margin-bottom:16px">No hay acceso a la base de datos en esta vista. Abre la app con tu cuenta de Claude.</div>'); return; }
 S.db = db; let got = {items:false, cats:false};
 const okTxt = window.__cuareLocal ? 'Guardado en este dispositivo' : 'Guardado en línea ✓';
 const done = (k, snap) => { got[k] = true; if (got.items && got.cats && !snap.metadata.fromCache) { clearTimeout(timer); $('#sync').textContent = okTxt; } if (got.items && got.cats && !S.ready) { S.ready = true; route(); return; } if (S.ready) render(); };
 const err = () => { clearTimeout(timer); $('#sync').textContent = 'Error de conexión'; };
 db.collection('items').onSnapshot(s => { S.items = s.docs.map(d => d.data()); done('items', s); }, err);
 db.collection('cats').onSnapshot(s => { S.cats = s.docs.map(d => d.data()).sort((a,b)=>(a.orden||0)-(b.orden||0)); done('cats', s); }, err);
 db.collection('movs').orderBy('ts','desc').limit(1000).onSnapshot(s => { S.movs = s.docs.map(d => d.data()); if (S.ready) render(); }, () => {});
})();
}
</script>
